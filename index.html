      hx("div", { style: { fontSize: 13, color: T.textMuted, lineHeight: 1.6 } }, "Ви граєте як ", hx("b", { style: { color: T.gold } }, nickFinal), ". Щоб змінити ім'я, відкрийте «Налаштування».")
    ),

    hx("div", { style: box },
      hx("div", { style: { fontWeight: 700, marginBottom: 4 } }, "Створити кімнату"),
      label("Назва кімнати"),
      hx("input", { value: roomName, onChange: (e) => setRoomName(e.target.value), placeholder: "Вечірній Деберц", maxLength: 24, style: input }),
      hx("div", { style: { display: "flex", gap: 8, marginTop: 12 } },
        hx(SegButton, { T, color: T.gold, active: isPublic, onClick: () => setIsPublic(true) }, "Публічна"),

      hx("div", { style: { fontSize: 11.5, color: T.textMuted, marginTop: 8, lineHeight: 1.5 } }, isPublic ? "Публічну кімнату видно в списку нижче." : "Приватна кімната — лише за кодом або посиланням."),
      hx("button", { onClick: doCreate, style: { ...btn(true), marginTop: 14 } }, "Створити кімнату")
    ),
    hx("div", { style: box },

        hx("input", { value: code, onChange: (e) => setCode(e.target.value.toUpperCase()), placeholder: "КОД", maxLength: 8, style: { ...input, fontFamily: "'IBM Plex Mono',monospace", letterSpacing: 4, textAlign: "center", fontSize: 18, flex: 1 } }),
        hx("button", { onClick: () => doJoin(), style: { ...btn(true), width: "auto", padding: "0 22px" } }, "Увійти")

      list.map((r, i) => hx("div", { key: r.code, className: "fx-in", style: { animationDelay: `${i * 50}ms`, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "11px 0", borderTop: `1px dashed ${T.border}` } },

          hx("div", { style: { fontSize: 11.5, color: T.textMuted } }, `${r.hostName} · ${timeAgo(r.updatedAt)} · код ${r.code}`)

/* ===================== АНІМОВАНИЙ ФОН (canvas): аврора, частинки, конфетті ===================== */
/* Події: window "fx:burst" — конфетті; тема береться з document.documentElement.dataset.theme. */
function FxBackground() {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const glyphs = ["♠", "♥", "♦", "♣"];
    let w = 0, h = 0, dpr = 1, raf = 0, parts = [], bits = [];

    const palette = () => (document.documentElement.dataset.theme === "light"
      ? { a: "14,124,154", b: "176,122,30", ink: "14,124,154" }
      : { a: "94,234,190", b: "245,200,106", ink: "94,234,190" });

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      cv.width = w * dpr;
      cv.height = h * dpr;
      cv.style.width = w + "px";
      cv.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = reduce ? 0 : Math.min(54, Math.round((w * h) / 24000) + 14);
      parts = Array.from({ length: n }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        s: 10 + Math.random() * 16,
        v: 0.1 + Math.random() * 0.32,
        dx: (Math.random() - 0.5) * 0.2,
        a: 0.07 + Math.random() * 0.2,
        g: glyphs[(Math.random() * 4) | 0],
        ph: Math.random() * 6.28
      }));
    };

    const burst = () => {
      const p = palette();
      const cols = [p.a, p.b, "255,255,255"];
      for (let i = 0; i < 150; i++) {
        bits.push({
          x: w / 2 + (Math.random() - 0.5) * w * 0.3,
          y: h * 0.38,
          vx: (Math.random() - 0.5) * 13,
          vy: -(Math.random() * 13 + 5),
          rot: Math.random() * 6.28,
          vr: (Math.random() - 0.5) * 0.3,
          sz: 6 + Math.random() * 7,
          col: cols[(Math.random() * cols.length) | 0],
          life: 150 + Math.random() * 90
        });
      }
    };

    const draw = (t) => {
      const p = palette();
      ctx.clearRect(0, 0, w, h);
      // Аврора: три м'які світлові плями, що повільно дрейфують.
      for (let i = 0; i < 3; i++) {
        const cx = w * (0.5 + 0.38 * Math.sin(t * 0.00012 * (i + 1) + i * 1.7));
        const cy = h * (0.22 + 0.18 * Math.cos(t * 0.0001 * (i + 1) + i * 2.3));
        const r = Math.max(w, h) * 0.6;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        const c = i === 1 ? p.b : p.a;
        g.addColorStop(0, `rgba(${c},${document.documentElement.dataset.theme === "light" ? 0.14 : 0.13})`);
        g.addColorStop(1, `rgba(${c},0)`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }
      // Плаваючі масті.
      ctx.textAlign = "center";
      parts.forEach((q) => {
        q.y -= q.v;
        q.x += q.dx + Math.sin(t * 0.001 + q.ph) * 0.15;
        if (q.y < -30) { q.y = h + 30; q.x = Math.random() * w; }
        ctx.font = `${q.s}px serif`;
        ctx.fillStyle = `rgba(${p.ink},${q.a * (0.7 + 0.3 * Math.sin(t * 0.002 + q.ph))})`;
        ctx.fillText(q.g, q.x, q.y);
      });
      // Конфетті.
      bits = bits.filter((b) => b.life > 0);
      bits.forEach((b) => {
        b.vy += 0.22;
        b.vx *= 0.985;
        b.x += b.vx;
        b.y += b.vy;
        b.rot += b.vr;
        b.life -= 1;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, b.life / 90));
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.fillStyle = `rgb(${b.col})`;
        ctx.fillRect(-b.sz / 2, -b.sz * 0.22, b.sz, b.sz * 0.44);
        ctx.restore();
      });
    };

    let last = 0;
    const loop = (t) => {
      // ~60 кадрів/с; на слабких пристроях м'яко знижуємо до ~30.
      if (t - last > 14) { draw(t); last = t; }
      raf = requestAnimationFrame(loop);
    };
    resize();
    const onBurst = () => burst();
    window.addEventListener("resize", resize);
    window.addEventListener("fx:burst", onBurst);
    if (reduce) draw(0);
    else raf = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      window.removeEventListener("fx:burst", onBurst);
    };
  }, []);
  return hx("canvas", { ref, id: "fx-canvas", "aria-hidden": "true" });
}

/* ===================== ПРАВИЛА (картинки і схеми) ===================== */
function dzCard(rank, suit, hl) {
  const red = suit === "♥" || suit === "♦";
  const ink = red ? "#B3261E" : "#1B2A22";
  const stroke = hl ? "#D8B26A" : "#8FA596";
  return `<svg class="dzr-card${hl ? " hl" : ""}" viewBox="0 0 64 90" role="img" aria-label="${rank}${suit}"><rect x="2" y="2" width="60" height="86" rx="9" fill="#FFFCF3" stroke="${stroke}" stroke-width="${hl ? 2.5 : 1.5}"/><text x="9" y="21" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="15" fill="${ink}">${rank}</text><text x="9" y="33" font-size="12" fill="${ink}">${suit}</text><text x="32" y="59" text-anchor="middle" font-size="28" fill="${ink}">${suit}</text><text x="55" y="69" text-anchor="end" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="15" fill="${ink}">${rank}</text><text x="55" y="81" text-anchor="end" font-size="12" fill="${ink}">${suit}</text></svg>`;
}
function rulesCss(T, neon, ng) {
  return `
.dzr{--c:${T.gold};--p:${T.panel};--pa:${T.panelAlt};--t:${T.text};--m:${T.textMuted};--b:${T.border};--n:${neon};--ng:${ng};max-width:480px;margin:0 auto;padding:14px 16px 40px;color:var(--t);font-family:Inter,sans-serif}
.dzr-hero{position:relative;overflow:hidden;border:1px solid var(--n);border-radius:20px;padding:20px 18px 18px;background:linear-gradient(160deg,var(--pa),var(--p));margin-bottom:18px;box-shadow:0 0 0 1px var(--ng),0 0 26px var(--ng)}
.dzr-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--ng) 1px,transparent 1px),linear-gradient(90deg,var(--ng) 1px,transparent 1px);background-size:22px 22px;opacity:.45;pointer-events:none}
.dzr-hero::after{content:"";position:absolute;left:0;right:0;height:45%;top:-45%;background:linear-gradient(transparent,var(--ng),transparent);animation:dzscan 5s linear infinite;pointer-events:none}
.dzr-hero>*{position:relative}
.dzr-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--n)}
.dzr-hero h1{font-family:Fraunces,serif;font-size:30px;margin:6px 0 4px;letter-spacing:.2px}
.dzr-hero p{margin:0;color:var(--m);font-size:13.5px}
.dzr-sec{background:var(--p);border:1px solid var(--b);border-top:2px solid var(--n);border-radius:18px;padding:16px 16px 14px;margin-bottom:14px;animation:dzin .5s ease both}
.dzr-num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--n);letter-spacing:.14em}
.dzr-sec h2{font-family:Fraunces,serif;font-size:20px;margin:4px 0 8px}
.dzr-sec p{font-size:13.5px;line-height:1.6;color:var(--m);margin:8px 0}
.dzr-sec b{color:var(--t)}
.dzr-row{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin:12px 0 4px}
.dzr-tags{margin-top:6px}
.dzr-card{width:50px;height:auto;filter:drop-shadow(0 5px 6px rgba(0,0,0,.28));transition:transform .2s ease}
.dzr-card:hover{transform:translateY(-5px) rotate(-2deg)}
.dzr-card.hl{filter:drop-shadow(0 0 7px var(--ng)) drop-shadow(0 5px 6px rgba(0,0,0,.25))}
.dzr-tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--n);color:var(--n);background:var(--ng)}
.dzr-tag-big{font-size:13px;font-weight:600;margin-top:10px;letter-spacing:.08em}
.dzr-combo{padding:12px 0 6px;border-top:1px dashed var(--b);margin-top:8px}
.dzr-combo-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14.5px}
.dzr-val{font-family:'IBM Plex Mono',monospace;color:var(--c);font-size:14px}
.dzr-hint{font-size:12px;color:var(--m);margin-top:3px;line-height:1.5}
.dzr-bar{position:relative;height:12px;border-radius:99px;background:var(--pa);border:1px solid var(--b);margin:18px 0 24px}
.dzr-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--n),var(--c));box-shadow:0 0 14px var(--ng)}
.dzr-bar span{position:absolute;top:18px;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--m)}
.dzr-bar span:last-child{transform:translateX(0)}
.dzr-bar span:first-of-type{transform:none}
.dzr-big{font-size:52px;line-height:1;color:var(--c);text-shadow:0 0 16px var(--ng);margin:4px 0 2px}
.dzr-flow,.dzr-formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin:12px 0 4px}
.dzr-flow span,.dzr-formula span{padding:6px 10px;border-radius:10px;border:1px solid var(--b);background:var(--pa)}
.dzr-flow b,.dzr-formula b{color:var(--n)}
.dzr-flow .neg{color:#D9695F;border-color:#D9695F}
.dzr-formula b{color:var(--c)}
@keyframes dzscan{to{top:110%}}
@keyframes dzin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dzr-hero::after,.dzr-sec{animation:none}.dzr-card{transition:none}}
@media (max-width:360px){.dzr-card{width:44px}}
