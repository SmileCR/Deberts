@keyframes fxFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes fxGlow { 0%, 100% { box-shadow: 0 0 0 rgba(245,200,106,0); } 50% { box-shadow: 0 0 26px rgba(245,200,106,.35); } }
@keyframes fxShimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes fxCount { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.fx-in { animation: fxIn .6s cubic-bezier(.2, .8, .2, 1) both; }
.fx-pulse { animation: fxPulse 1.6s ease-in-out infinite; display: inline-block; }
.fx-status { transition: color .3s; }

}

      if (r) return true;
    }
  } catch (e) {
  }
  try {
    if (typeof window !== "undefined" && window.localStorage) {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    }
  } catch (e) {
  }
  return false;
}
async function loadGame() {
  try {

      const r = await window.storage.get(STORAGE_KEY, false);

    }
  } catch (e) {
  }
  try {
    if (typeof window !== "undefined" && window.localStorage) {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);

  } catch (e) {
  }
  return null;
}

const APP_VERSION = "2026.11.11-8";
async function fetchLatestVersion() {
  const r = await fetch(location.pathname + "?vcheck=" + Date.now(), { cache: "no-store" });

}

}

    } catch (e) {

/* ===================== АНІМОВАНИЙ ФОН (canvas): аврора, частинки, конфетті ===================== */
/* Події: window "fx:burst" — конфетті; тема береться з document.documentElement.dataset.theme. */
function FxBackground() {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const ctx = cv.getContext("2d");
    const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const glyphs = ["♠", "♥", "♦", "♣"];
    let w = 0, h = 0, dpr = 1, raf = 0, parts = [], bits = [];

    const palette = () => (document.documentElement.dataset.theme === "light"
      ? { a: "14,124,154", b: "176,122,30", ink: "14,124,154" }
      : { a: "94,234,190", b: "245,200,106", ink: "94,234,190" });

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      cv.width = w * dpr;
      cv.height = h * dpr;
      cv.style.width = w + "px";
      cv.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = reduce ? 0 : Math.min(54, Math.round((w * h) / 24000) + 14);
      parts = Array.from({ length: n }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        s: 10 + Math.random() * 16,
        v: 0.1 + Math.random() * 0.32,
        dx: (Math.random() - 0.5) * 0.2,
        a: 0.07 + Math.random() * 0.2,
        g: glyphs[(Math.random() * 4) | 0],
        ph: Math.random() * 6.28
      }));
    };

    const burst = () => {
      const p = palette();
      const cols = [p.a, p.b, "255,255,255"];
      for (let i = 0; i < 150; i++) {
        bits.push({
          x: w / 2 + (Math.random() - 0.5) * w * 0.3,
          y: h * 0.38,
          vx: (Math.random() - 0.5) * 13,
          vy: -(Math.random() * 13 + 5),
          rot: Math.random() * 6.28,
          vr: (Math.random() - 0.5) * 0.3,
          sz: 6 + Math.random() * 7,
          col: cols[(Math.random() * cols.length) | 0],
          life: 150 + Math.random() * 90
        });
      }
    };

    const draw = (t) => {
      const p = palette();
      ctx.clearRect(0, 0, w, h);
      // Аврора: три м'які світлові плями, що повільно дрейфують.
      for (let i = 0; i < 3; i++) {
        const cx = w * (0.5 + 0.38 * Math.sin(t * 0.00012 * (i + 1) + i * 1.7));
        const cy = h * (0.22 + 0.18 * Math.cos(t * 0.0001 * (i + 1) + i * 2.3));
        const r = Math.max(w, h) * 0.6;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        const c = i === 1 ? p.b : p.a;
        g.addColorStop(0, `rgba(${c},${document.documentElement.dataset.theme === "light" ? 0.14 : 0.13})`);
        g.addColorStop(1, `rgba(${c},0)`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }
      // Плаваючі масті.
      ctx.textAlign = "center";
      parts.forEach((q) => {
        q.y -= q.v;
        q.x += q.dx + Math.sin(t * 0.001 + q.ph) * 0.15;
        if (q.y < -30) { q.y = h + 30; q.x = Math.random() * w; }
        ctx.font = `${q.s}px serif`;
        ctx.fillStyle = `rgba(${p.ink},${q.a * (0.7 + 0.3 * Math.sin(t * 0.002 + q.ph))})`;
        ctx.fillText(q.g, q.x, q.y);
      });
      // Конфетті.
      bits = bits.filter((b) => b.life > 0);
      bits.forEach((b) => {
        b.vy += 0.22;
        b.vx *= 0.985;
        b.x += b.vx;
        b.y += b.vy;
        b.rot += b.vr;
        b.life -= 1;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, b.life / 90));
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.fillStyle = `rgb(${b.col})`;
        ctx.fillRect(-b.sz / 2, -b.sz * 0.22, b.sz, b.sz * 0.44);
        ctx.restore();
      });
    };

    let last = 0;
    const loop = (t) => {
      // ~60 кадрів/с; на слабких пристроях м'яко знижуємо до ~30.
      if (t - last > 14) { draw(t); last = t; }
      raf = requestAnimationFrame(loop);
    };
    resize();
    const onBurst = () => burst();
    window.addEventListener("resize", resize);
    window.addEventListener("fx:burst", onBurst);
    if (reduce) draw(0);
    else raf = requestAnimationFrame(loop);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      window.removeEventListener("fx:burst", onBurst);
    };
  }, []);
  return hx("canvas", { ref, id: "fx-canvas", "aria-hidden": "true" });
}
